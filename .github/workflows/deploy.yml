name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Stamp build version (live-update support)
        run: |
          SHORT_SHA="${GITHUB_SHA:0:10}"
          printf '{"sha":"%s","builtAt":"%s"}\n' "$SHORT_SHA" "$(date -u +%FT%TZ)" > public/static/version.json
          find public -name '*.html' -exec sed -i "s/BUILD_SHA_PLACEHOLDER/$SHORT_SHA/g" {} +
          echo "build-sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
      - name: Sanitize search index for time-gating (strip pending slice text)
        run: |
          python3 - << 'PYEOF'
          import json, os
          p = "public/static/contentIndex.json"
          if not os.path.exists(p):
              raise SystemExit(0)
          with open(p, encoding="utf-8") as f:
              data = json.load(f)
          MARK = "🔒 星轨观测锁定"
          TEASER = "🔒 后续世界线已封存，随东京时间逐日解锁。"
          # contentIndex.tsx 的正文字段名是 content；此处曾误写 "text" 导致截断从未生效
          FIELD = "content"
          def trim(txt):
              i = txt.find(MARK)
              if i == -1:
                  return txt, False
              return txt[:i] + TEASER, True
          # 回归自检：字段名或截断逻辑再退化成 no-op 时，构建必须在这里失败
          probe = "visible prefix " + MARK + " badge · 将于 01-01 00:00 JST 抵达成像点 SECRET-FUTURE-BODY-9f2a"
          cleaned, hit = trim(probe)
          assert hit and "SECRET-FUTURE-BODY-9f2a" not in cleaned, "sanitize self-test failed"
          changed = 0
          for slug, entry in data.items():
              if isinstance(entry.get(FIELD), str):
                  entry[FIELD], hit = trim(entry[FIELD])
                  changed += hit
          with open(p, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
          for slug, entry in data.items():
              assert MARK not in (entry.get(FIELD) or ""), f"time-gate leak survived in {slug}"
          print(f"time-gate: trimmed {changed} page(s); post-check clean")
          PYEOF
      - name: Export runtime snapshot (STARFIELD_FLESH_CONTRACT_V1)
        run: |
          python3 scripts/export_runtime.py --content-dir content --out-dir public/static/runtime
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
